{% set name = "mp-pyrho" %}
{% set version = "0.5.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 11fd416a1e505ef7e083940c73a37ce3fff6230fa60b2f6f9348925f00cd0107

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - versioningit
  run:
    - python >={{ python_min }}
    - pymatgen >=2023.9.21

test:
  requires:
    - python {{ python_min }}
  imports:
    - pyrho

about:
  home: https://github.com/materialsproject/pyrho
  license: BSD-3-Clause-LBNL
  license_family: BSD
  license_file: LICENSE
  summary: Tools for re-griding volumetric quantum chemistry data for machine-learning purposes
  doc_url: https://materialsproject.github.io/pyrho/
  dev_url: https://github.com/materialsproject/pyrho

extra:
  recipe-maintainers:
    - njzjz
